<!doctype html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  :root { --bg:#f5f6f8; --surface:#fff; --text:#1d2330; --muted:#5d6676; --border:#dde1e7; --accent:#2f5bd3; --danger:#c0392b; --warn-bg:#fff4e0; --warn:#8a5300; --bad-bg:#fdecea; --radius:10px; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
  h1, h2 { line-height: 1.25; margin: 0 0 .5em; } h1 { font-size: 1.45rem; } h2 { font-size: 1.15rem; }
  .wrap { max-width: 820px; margin: 0 auto; padding: 24px 16px 64px; }
  .narrow { max-width: 520px; margin-top: 6vh; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; }
  .muted { color: var(--muted); }
  .error { color: var(--danger); font-weight: 600; }
  .hidden { display: none !important; }
  button { font: inherit; font-weight: 600; padding: 10px 18px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .55; cursor: default; }
  .topbar { position: sticky; top: 0; z-index: 10; background: var(--surface); border-bottom: 1px solid var(--border); }
  .topbar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 16px; }
  .timer { font: 700 1.2rem ui-monospace, Menlo, Consolas, monospace; } .timer.low { color: var(--danger); }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: .78rem; font-weight: 700; background: var(--warn-bg); color: var(--warn); }
  .badge.bad { background: var(--bad-bg); color: var(--danger); }
  .q { user-select: none; -webkit-user-select: none; }
  .q .num { color: var(--muted); font-size: .85rem; font-weight: 700; }
  .q .text { font-size: 1.05rem; margin: 4px 0 12px; white-space: pre-wrap; }
  .choice { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; cursor: pointer; }
  .choice.sel { border-color: var(--accent); background: #eef2fc; }
  .choice input { margin-top: 5px; }
  .q input[type=text] { display: block; width: 100%; padding: 9px 11px; font: inherit; border: 1px solid var(--border); border-radius: 8px; user-select: text; }
  .overlay { position: fixed; inset: 0; background: rgba(15,20,30,.72); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 50; }
  .overlay .card { max-width: 480px; width: 100%; text-align: center; margin: 0; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--text); color: #fff; padding: 10px 18px; border-radius: 8px; z-index: 60; font-weight: 600; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 16px; margin: 12px 0; } dt { color: var(--muted); } dd { margin: 0; font-weight: 600; }
</style>
</head>
<body>

<div id="welcome" class="wrap narrow">
  <div class="card">
    <h1 id="wTitle">Online exam</h1>
    <div id="wBody"><p class="muted">Checking your account…</p></div>
  </div>
</div>

<div id="exam" class="hidden">
  <div class="topbar"><div class="wrap">
    <div><strong id="examTitle"></strong><div class="muted" style="font-size:.85rem" id="who"></div></div>
    <div style="text-align:right"><div class="timer" id="timer">--:--</div><div id="depBadge"></div></div>
  </div></div>
  <div class="wrap">
    <div class="card" id="instructions"></div>
    <div id="qs"></div>
    <div class="card" style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
      <span class="muted" id="saveState">Your answers save automatically.</span>
      <button class="primary" id="submitBtn" type="button">Submit exam</button>
    </div>
  </div>
</div>

<div id="done" class="wrap narrow hidden">
  <div class="card" style="text-align:center">
    <h1>Exam submitted</h1>
    <p id="doneMsg" class="muted"></p>
    <p id="doneScore" style="font-size:1.4rem;font-weight:700"></p>
  </div>
</div>

<div id="overlay" class="overlay hidden"><div class="card">
  <h2 id="ovTitle"></h2><p id="ovText"></p>
  <div style="display:flex;gap:8px;justify-content:center">
    <button id="ovCancel" class="hidden">Cancel</button><button id="ovBtn" class="primary"></button>
  </div>
</div></div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let exam, answers = {}, deadline = 0, clockOffset = 0, departures = 0, unsaved = false;
let monitoring = false, done = false, away = false, fullscreenWorks = false, timerId;

// ---------- calls to the server, one at a time, retried if Google is busy ----------
let chain = Promise.resolve();
function call(fn, ...args) {
  const p = chain.then(() => tryCall(fn, args, 0));
  chain = p.catch(() => {});
  return p;
}
function tryCall(fn, args, n) {
  return new Promise((resolve, reject) => {
    google.script.run
      .withSuccessHandler(resolve)
      .withFailureHandler((err) => {
        if (n >= 5) return reject(err);
        setTimeout(() => tryCall(fn, args, n + 1).then(resolve, reject), 1000 * Math.pow(2, n) + Math.random() * 800);
      })[fn](...args);
  });
}

function overlay(title, text, btn, onClick, cancel) {
  $('#ovTitle').textContent = title; $('#ovText').textContent = text; $('#ovBtn').textContent = btn;
  $('#ovBtn').onclick = () => { $('#overlay').classList.add('hidden'); if (onClick) onClick(); };
  $('#ovCancel').classList.toggle('hidden', !cancel);
  $('#ovCancel').onclick = () => $('#overlay').classList.add('hidden');
  $('#overlay').classList.remove('hidden');
}
let toastTimer;
function toast(msg) {
  let t = $('.toast'); if (!t) { t = document.createElement('div'); t.className = 'toast'; document.body.append(t); }
  t.textContent = msg; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 2600);
}
function showError(msg) { $('#wBody').innerHTML = `<p class="error">${esc(msg)}</p><button onclick="location.reload()">Try again</button>`; }

// ---------- welcome ----------
call('apiCheck').then((d) => {
  if (d.done) return finish({}, d.message);
  if (d.error) return showError(d.error);
  $('#wTitle').textContent = d.title;
  $('#wBody').innerHTML = `
    <dl><dt>Name</dt><dd>${esc(d.name)}</dd><dt>Email</dt><dd>${esc(d.email)}</dd><dt>Section</dt><dd>${esc(d.section)}</dd>
        <dt>Questions</dt><dd>${d.count}</dd><dt>Time limit</dt><dd>${d.duration} minutes${d.resuming ? ` (about ${d.minutesLeft} left)` : ''}</dd></dl>
    <p style="white-space:pre-wrap">${esc(d.instructions)}</p>
    <p class="muted">Leaving this page (switching tabs, opening another window or app) is recorded.${d.maxDepartures ? ` After ${d.maxDepartures} time${d.maxDepartures > 1 ? 's' : ''}, your exam is submitted automatically.` : ''} The timer starts when you click the button below.</p>
    <p class="muted">Not you? Sign out of Google and open the link again with your own account.</p>
    <button class="primary" id="startBtn" style="width:100%">${d.resuming ? 'Continue exam' : 'Start exam'}</button>`;
  $('#startBtn').onclick = start;
}).catch((e) => showError('Could not connect. Check your internet and try again. (' + (e && e.message || e) + ')'));

function start() {
  $('#startBtn').disabled = true; $('#startBtn').textContent = 'Starting…';
  goFullscreen(); // must happen inside the click
  call('apiStart').then((d) => {
    if (d.done) return finish({}, d.message);
    if (d.error) return showError(d.error);
    exam = d.exam; answers = d.state.answers || {}; deadline = d.state.deadline; departures = d.state.departures;
    clockOffset = d.state.serverNow - Date.now();
    $('#welcome').classList.add('hidden'); $('#exam').classList.remove('hidden');
    $('#examTitle').textContent = exam.title; $('#who').textContent = d.name;
    $('#instructions').innerHTML = `<h2>Instructions</h2><p style="white-space:pre-wrap;margin:0">${esc(exam.instructions || 'Answer all questions.')}</p>`;
    renderQuestions(); updateBadge();
    timerId = setInterval(tick, 500); tick();
    setInterval(autosave, 20000);
    monitoring = true;
    if (document.hidden || !document.hasFocus()) leave('not focused when the exam started');
  }).catch((e) => showError('Could not start the exam. Try again. (' + (e && e.message || e) + ')'));
}

function renderQuestions() {
  $('#qs').innerHTML = exam.questions.map((q, i) => `
    <div class="card q">
      <div class="num">Question ${i + 1} of ${exam.questions.length} · ${q.points} point${q.points == 1 ? '' : 's'}</div>
      <div class="text">${esc(q.text)}</div>
      ${q.type === 'mc'
        ? q.choices.map((c) => `<label class="choice ${answers[q.id] === c.l ? 'sel' : ''}"><input type="radio" name="${esc(q.id)}" value="${c.l}" ${answers[q.id] === c.l ? 'checked' : ''}><span><b>${c.l}.</b> ${esc(c.t)}</span></label>`).join('')
        : `<input type="text" name="${esc(q.id)}" value="${esc(answers[q.id] || '')}" maxlength="300" autocomplete="off" spellcheck="false" placeholder="Type your answer">`}
    </div>`).join('');
}
$('#qs').addEventListener('input', (e) => {
  const t = e.target; if (!t.name) return;
  answers[t.name] = t.value; unsaved = true;
  if (t.type === 'radio') t.closest('.q').querySelectorAll('.choice').forEach((l) => l.classList.toggle('sel', l.contains(t)));
  $('#saveState').textContent = 'Saving soon…';
});
function autosave() {
  if (!unsaved || done) return;
  unsaved = false;
  call('apiSave', answers).then((d) => { if (d.submitted) return finish({}, 'Time is up. Your answers were submitted.'); $('#saveState').textContent = 'All answers saved.'; })
    .catch(() => { unsaved = true; $('#saveState').textContent = 'Not saved yet. Check your internet.'; });
}

function tick() {
  const left = Math.max(0, deadline - (Date.now() + clockOffset));
  $('#timer').textContent = `${Math.floor(left / 60000)}:${String(Math.floor(left / 1000) % 60).padStart(2, '0')}`;
  $('#timer').classList.toggle('low', left < 60000);
  if (left <= 0 && !done) submit('time');
}
function updateBadge() {
  $('#depBadge').innerHTML = departures ? `<span class="badge ${exam.maxDepartures && departures >= exam.maxDepartures - 1 ? 'bad' : ''}">Left page: ${departures}${exam.maxDepartures ? ' / ' + exam.maxDepartures : ''}</span>` : '';
}

// ---------- submit ----------
$('#submitBtn').onclick = () => {
  const n = exam.questions.filter((q) => !answers[q.id]).length;
  overlay('Submit exam?', (n ? `You have ${n} unanswered question${n > 1 ? 's' : ''}. ` : '') + 'You cannot change your answers after submitting.', 'Submit', () => submit('student'), true);
};
function submit(reason) {
  if (done) return;
  done = true;
  $('#submitBtn').disabled = true; $('#saveState').textContent = 'Submitting…';
  call('apiSubmit', answers, reason)
    .then((d) => finish(d, reason === 'time' ? 'Time is up. Your answers were submitted.' : 'Your answers were submitted.'))
    .catch(() => { done = false; $('#submitBtn').disabled = false; toast('Could not submit. Check your internet and try again.'); });
}
function finish(d, msg) {
  done = true; monitoring = false; clearInterval(timerId);
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  ['#overlay', '#exam', '#welcome'].forEach((s) => $(s).classList.add('hidden'));
  $('#done').classList.remove('hidden');
  $('#doneMsg').textContent = msg + ' You may now close this page.';
  $('#doneScore').textContent = d && d.score !== undefined ? `Score: ${d.score} / ${d.total}` : '';
}

// ---------- detection ----------
function goFullscreen() {
  if (exam && !exam.fullscreen) return;
  const el = document.documentElement;
  if (!el.requestFullscreen || document.fullscreenElement) return;
  // Google's frame may not allow fullscreen; if so, carry on without it.
  el.requestFullscreen().then(() => { fullscreenWorks = true; }).catch(() => {});
}
function leave(detail) {
  if (!monitoring || done || away) return;
  away = true;
  unsaved = false;
  call('apiEvent', 'left', detail, answers).then((d) => {
    departures = d.departures; updateBadge();
    if (d.submitted) finish({}, `You left the exam page ${departures} times, so your exam was submitted automatically.`);
  }).catch(() => {});
}
function comeBack() {
  if (!monitoring || done || !away) return;
  away = false;
  call('apiEvent', 'returned', '', null).then((d) => {
    departures = d.departures; updateBadge();
    if (d.submitted) return finish({}, `You left the exam page ${departures} times, so your exam was submitted automatically.`);
    const left = d.max - departures;
    const rest = d.max ? ` If you leave ${left} more time${left > 1 ? 's' : ''}, your exam will be submitted automatically.` : ' Your teacher will see this.';
    overlay('You left the exam page', `This has been recorded (${departures}${d.max ? ' of ' + d.max : ''}).${rest}`, 'Back to exam', () => { if (fullscreenWorks) goFullscreen(); });
  }).catch(() => {});
}
document.addEventListener('visibilitychange', () => document.hidden ? leave('switched tab or minimized') : comeBack());
window.addEventListener('blur', () => leave('clicked outside the exam'));
window.addEventListener('focus', () => { if (!document.hidden) comeBack(); });
window.addEventListener('pagehide', () => leave('closed or reloaded the page'));

document.addEventListener('fullscreenchange', () => {
  if (!monitoring || done || !fullscreenWorks || document.fullscreenElement) return;
  call('apiEvent', 'fullscreen-exit', '', null).catch(() => {});
  overlay('Fullscreen required', 'Leaving fullscreen has been recorded. Return to fullscreen to continue.', 'Return to fullscreen', goFullscreen);
});
['copy', 'cut', 'paste', 'contextmenu'].forEach((ev) => document.addEventListener(ev, (e) => {
  if (!monitoring || done || !exam.blockCopy) return;
  e.preventDefault();
  const type = ev === 'contextmenu' ? 'right-click' : ev;
  call('apiEvent', type, '', null).catch(() => {});
  toast((type === 'right-click' ? 'Right-click' : type[0].toUpperCase() + type.slice(1)) + ' is disabled during the exam.');
}));
document.addEventListener('keydown', (e) => {
  if (!monitoring || done || !exam.blockCopy) return;
  const k = e.key.toLowerCase();
  if ((e.ctrlKey || e.metaKey) && ['p', 's', 'u', 'f'].indexOf(k) >= 0) { e.preventDefault(); call('apiEvent', 'shortcut', 'Ctrl+' + k.toUpperCase(), null).catch(() => {}); }
});
</script>
</body>
</html>
