<style>
/* RTU Online Exams. Same Maroon and Gold colour system as the online modules. */
:root {
  --night: #2A0E14; --night-2: #3B141C; --plum: #6E1F2C; --plum-2: #9E2A3E; --plum-3: #C9566A;
  --plum-soft: #FAE9EC; --plum-pale: #FCF6F7; --plum-line: #EFCBD1;
  --amber: #E99F0C; --amber-2: #F5BB47; --amber-ink: #664605; --amber-soft: #FDF1D8; --amber-line: #EFCA80;
  --amber-grad: linear-gradient(135deg, #F7C96E, #E99F0C);
  --ok: #1E7A46; --ok-bg: #E2F4EA; --ok-bd: #9CD6B5;
  --no: #B3261E; --no-bg: #FDE7E9; --no-bd: #F2A9AE;
  --ink: #37181D; --ink-soft: #6E5156; --line: #EFDEE1; --bg: #FCF6F7; --card: #FFFFFF;
  --shadow: 0 1px 2px rgba(42, 14, 20, .06), 0 10px 30px rgba(42, 14, 20, .08);
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 70px; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Arial, sans-serif;
  font-size: 16.5px; line-height: 1.65; -webkit-font-smoothing: antialiased;
}
a { color: var(--plum-2); }
a:focus-visible, button:focus-visible { outline: 3px solid var(--amber); outline-offset: 3px; }
img { max-width: 100%; height: auto; }

.progress { position: fixed; z-index: 100; top: 0; left: 0; width: 0; height: 4px; background: var(--amber-grad); box-shadow: 0 0 10px rgba(233, 159, 12, .6); }
.banner {
  background: var(--night); color: #FAEDEF; border-bottom: 3px solid var(--amber);
  text-align: center; padding: 9px 16px; font-size: .82rem; line-height: 1.45; letter-spacing: .02em;
}
.banner b { color: var(--amber-2); }
.banner span { opacity: .8; }

/* Hero */
header.hero {
  position: relative; overflow: hidden; color: #FFFFFF; padding: 52px 34px 54px; border-radius: 0 0 30px 30px;
  background:
    radial-gradient(circle at 92% 6%, rgba(233, 159, 12, .2) 0, transparent 38%),
    radial-gradient(circle at 4% 96%, rgba(201, 86, 106, .45) 0, transparent 42%),
    linear-gradient(135deg, #2A0E14 0%, #6E1F2C 55%, #9E2A3E 100%);
}
header.hero::after {
  content: attr(data-num); position: absolute; right: -10px; bottom: -70px;
  font-size: clamp(8rem, 20vw, 16rem); font-weight: 900; line-height: 1; letter-spacing: -.08em;
  color: rgba(255, 255, 255, .06); pointer-events: none;
}
.hero .inner { position: relative; max-width: 1080px; margin: 0 auto; display: flex; gap: 22px; align-items: flex-start; }
.hero .logo { width: 84px; height: 84px; border-radius: 50%; background: #FFFFFF; padding: 3px; flex: none; box-shadow: 0 8px 24px rgba(0, 0, 0, .3); }
.hero .txt { flex: 1; min-width: 0; }
.crumbs { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: .8rem; font-weight: 700; margin-bottom: 14px; }
.crumbs a { color: #FBE1AC; text-decoration: none; background: rgba(255, 255, 255, .12); border: 1px solid rgba(255, 255, 255, .22); padding: 5px 12px; border-radius: 999px; }
.crumbs a:hover { background: rgba(255, 255, 255, .2); }
.eyebrow { display: inline-block; color: #FBE1AC; font-weight: 800; font-size: .74rem; letter-spacing: 1.3px; text-transform: uppercase; }
.hero h1 { font-size: clamp(2rem, 4.6vw, 3.2rem); line-height: 1.08; margin: 10px 0 10px; letter-spacing: -1px; font-weight: 850; }
.hero h1 em { font-style: normal; color: var(--amber-2); font-size: .55em; letter-spacing: 0; white-space: nowrap; }
.hero h1 small { display: block; font-size: .42em; letter-spacing: .5px; color: var(--amber-2); font-weight: 700; margin-bottom: 6px; }
.hero p { max-width: 72ch; color: #F6E2E5; font-size: 1.05rem; margin: 0 0 18px; }
.hchips { display: flex; flex-wrap: wrap; gap: 9px; align-items: center; }
.hchips span { background: rgba(255, 255, 255, .12); border: 1px solid rgba(255, 255, 255, .22); border-radius: 999px; padding: 6px 14px; font-size: .8rem; font-weight: 700; }
.cta {
  display: inline-flex; align-items: center; gap: 8px; text-decoration: none; font-weight: 850; font-size: .92rem;
  padding: 10px 20px; border-radius: 12px; background: var(--amber-grad); color: #372603; box-shadow: 0 6px 18px rgba(233, 159, 12, .3);
}
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin: 26px 0 0; }
.facts div { background: rgba(255, 255, 255, .07); border: 1px solid rgba(255, 255, 255, .14); border-radius: 12px; padding: 12px 14px; }
.facts dt { font-size: .72rem; letter-spacing: .8px; text-transform: uppercase; color: #FBE1AC; font-weight: 800; margin: 0 0 3px; }
.facts dd { margin: 0; color: #FFFFFF; font-weight: 700; }

/* Sticky section nav */
nav.top { position: sticky; top: 0; z-index: 50; background: rgba(42, 14, 20, .97); border-bottom: 2px solid var(--amber); box-shadow: 0 8px 22px rgba(42, 14, 20, .2); }
nav.top .in { max-width: 1080px; margin: 0 auto; display: flex; align-items: center; overflow-x: auto; scrollbar-width: none; padding: 0 12px; }
nav.top .in::-webkit-scrollbar { display: none; }
nav.top a { flex: 0 0 auto; color: #F6E2E5; text-decoration: none; padding: 14px 12px; font-size: .78rem; font-weight: 700; border-bottom: 3px solid transparent; white-space: nowrap; }
nav.top a:hover, nav.top a.active { color: var(--amber-2); border-bottom-color: var(--amber); }
nav.top a.home { color: #FBE1AC; border-right: 1px solid rgba(255, 255, 255, .18); margin-right: 4px; }

/* Lesson body */
main { max-width: 1080px; margin: 30px auto 60px; padding: 0 20px; }
section.ch {
  background: var(--card); border: 1px solid var(--line); border-top: 5px solid var(--plum-2);
  border-radius: 18px; box-shadow: var(--shadow); padding: clamp(20px, 4vw, 40px); margin: 0 0 28px;
}
section.ch.accent { border-top-color: var(--amber); }
h2 { color: var(--plum); font-size: clamp(1.45rem, 3vw, 2rem); line-height: 1.15; margin: 0 0 10px; letter-spacing: -.4px; display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
h2 .num { font-size: .8em; color: var(--amber-ink); font-weight: 900; }
h3 { color: var(--plum-2); font-size: 1.15rem; margin: 26px 0 8px; }
p { margin: 8px 0 12px; }
.lead { font-size: 1.05rem; color: #59373D; }
.callout { margin: 16px 0; padding: 14px 18px; border-left: 5px solid var(--amber); background: var(--amber-soft); border-radius: 0 12px 12px 0; }
.callout.blue { border-color: var(--plum-3); background: var(--plum-pale); }
.callout.warn { border-color: var(--no); background: var(--no-bg); }
.callout.warn .label { color: var(--no); }
.callout .label { display: block; color: var(--plum); font-weight: 900; font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; margin-bottom: 4px; }
.callout > p:first-child { margin-top: 0; }
.callout > p:last-child { margin-bottom: 0; }
.eq { margin: 8px 0; padding: 4px 12px; background: #FFFFFF; border: 1px solid var(--plum-line); border-radius: 12px; overflow-x: auto; }
ul.checks { list-style: none; padding: 0; margin: 8px 0; }
.checks li { position: relative; padding: 5px 0 5px 30px; }
.checks li::before {
  content: "✓"; position: absolute; left: 0; top: 8px; width: 20px; height: 20px; display: grid; place-items: center;
  border-radius: 50%; background: var(--plum-2); color: #FBE1AC; font-size: .7rem; font-weight: 900;
}
figure { margin: 20px 0 8px; text-align: center; }
figure img { max-height: 380px; object-fit: contain; background: #FFFFFF; border: 1px solid var(--plum-line); border-radius: 12px; padding: 8px; }
figcaption { font-size: .9rem; color: var(--ink-soft); margin-top: 8px; text-align: left; }
table { border-collapse: separate; border-spacing: 0; margin: 12px 0; font-size: .92rem; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: block; overflow-x: auto; max-width: 100%; }
th { background: var(--plum-2); color: #FFFFFF; padding: 9px 12px; text-align: left; }
td { padding: 8px 12px; border-top: 1px solid var(--line); background: #FFFFFF; vertical-align: top; }
tbody tr:nth-child(even) td { background: var(--plum-pale); }

mjx-container:not([display="true"]) { display: inline-block; max-width: 100%; overflow-x: auto; overflow-y: hidden; vertical-align: middle; }
mjx-container[display="true"] { display: block; overflow-x: auto; overflow-y: hidden; max-width: 100%; padding: 2px 0; }

/* Problem cards: examples and activity items */
.prob { margin: 18px 0; border: 1px solid var(--plum-line); border-radius: 14px; background: #FFFFFF; overflow: hidden; box-shadow: var(--shadow); scroll-margin-top: 80px; }
.prob .head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--plum-pale); border-bottom: 1px solid var(--plum-line); padding: 10px 16px; }
.prob .head .n { font-weight: 900; color: var(--plum); }
.prob .head .t { font-weight: 800; color: var(--night); flex: 1; }
.prob .body { padding: 14px 18px 8px; }
.tag { font-size: .64rem; font-weight: 850; letter-spacing: .08em; text-transform: uppercase; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.tag.pts { background: #FFFFFF; color: var(--ink-soft); border: 1px solid var(--line); }
details.ans { margin: 0 18px 16px; border: 1px solid var(--amber-line); border-radius: 12px; background: #FEF9F0; }
details.ans summary { cursor: pointer; padding: 11px 16px 11px 48px; font-weight: 800; color: var(--amber-ink); list-style: none; position: relative; }
details.ans summary small { font-weight: 600; opacity: .75; }
details.ans summary::-webkit-details-marker { display: none; }
details.ans summary::before {
  content: "▸"; position: absolute; left: 16px; top: 10px; width: 22px; height: 22px; border-radius: 50%;
  background: var(--amber); color: #372603; display: grid; place-items: center; font-size: .8rem;
}
details.ans[open] summary::before { content: "▾"; background: var(--plum-2); color: #FFFFFF; }
details.ans .a { padding: 12px 18px 16px; color: #4B2A2F; border-top: 1px dashed var(--amber-line); }

/* Activity form */
.student { background: var(--plum-pale); border: 1px solid var(--plum-line); border-radius: 14px; padding: 16px 18px; margin: 18px 0; }
.student h3 { margin: 0 0 10px; }
.student-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
label.field { display: flex; flex-direction: column; font-size: .85rem; font-weight: 700; color: var(--ink-soft); gap: 4px; }
input[type=text], textarea {
  font: inherit; font-size: 1rem; color: var(--ink); background: #FFFFFF;
  border: 1px solid var(--plum-line); border-radius: 10px; padding: 9px 11px; width: 100%;
}
input:focus, textarea:focus { outline: 2px solid var(--plum-3); outline-offset: 1px; }
textarea { min-height: 110px; resize: vertical; }
.answer-row { display: flex; align-items: center; gap: 10px; margin: 6px 0 4px; flex-wrap: wrap; }
.answer-row input { max-width: 220px; }
.unit { color: var(--ink-soft); font-weight: 700; }
.final-label { font-weight: 800; font-size: .95rem; color: var(--plum); margin: 14px 0 0; }
.choices { display: flex; flex-direction: column; gap: 6px; margin: 8px 0; }
.choices label { display: flex; gap: 10px; align-items: flex-start; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; background: #FFFFFF; }
.choices label:hover { border-color: var(--plum-3); }
.choices input { margin-top: 6px; accent-color: var(--plum-2); }

.solution-box { margin-top: 12px; border: 1px solid var(--plum-line); border-radius: 12px; padding: 10px 12px; background: var(--plum-pale); }
.sol-label { font-weight: 800; font-size: .95rem; color: var(--plum); display: block; margin-bottom: 6px; }
.sol-label .req { font-weight: 600; color: var(--ink-soft); }
.toolbar { display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; }
.tb-row { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.tb-tag { font-size: .66rem; font-weight: 850; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-soft); min-width: 58px; }
.sym {
  font: inherit; font-size: .9rem; min-width: 32px; padding: 2px 7px; cursor: pointer;
  background: #FFFFFF; color: var(--ink); border: 1px solid var(--plum-line); border-radius: 7px;
}
.sym:hover { border-color: var(--amber); background: var(--amber-soft); }
.sym.tex { font-size: .8rem; }
.sol-input { min-height: 120px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .92rem; }
.sol-preview-wrap { margin-top: 6px; }
.sol-preview { min-height: 1.6em; white-space: pre-wrap; padding: 6px 10px; border-radius: 8px; background: #FFFFFF; border: 1px dashed var(--plum-line); overflow-x: auto; }

.prob.item.correct { border-color: var(--ok-bd); }
.prob.item.correct .head { background: var(--ok-bg); }
.prob.item.wrong { border-color: var(--no-bd); }
.prob.item.wrong .head { background: var(--no-bg); }
.verdict { font-weight: 800; font-size: .92rem; margin: 6px 0 8px; }
.item.correct .verdict { color: var(--ok); }
.item.wrong .verdict { color: var(--no); }

.consent { font-size: .85rem; color: var(--ink-soft); }
.btnrow { display: flex; gap: 10px; flex-wrap: wrap; }
.btn {
  font: inherit; font-weight: 850; background: var(--amber-grad); color: #372603; border: 0;
  border-radius: 12px; padding: 12px 26px; cursor: pointer; box-shadow: 0 6px 18px rgba(233, 159, 12, .3);
}
.btn[disabled] { opacity: .55; cursor: progress; }
.status { margin-top: 14px; padding: 12px 16px; border-radius: 12px; display: none; scroll-margin-top: 80px; }
.status.show { display: block; }
.status.ok { background: var(--ok-bg); color: var(--ok); border: 1px solid var(--ok-bd); }
.status.err { background: var(--no-bg); color: var(--no); border: 1px solid var(--no-bd); }
.status.info { background: var(--plum-pale); color: var(--plum); border: 1px solid var(--plum-line); }

/* Prev / next */
.chnav { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 10px; }
.chnav a { display: block; text-decoration: none; background: #FFFFFF; border: 1px solid var(--line); border-radius: 14px; padding: 14px 18px; color: var(--plum); font-weight: 800; box-shadow: var(--shadow); }
.chnav a small { display: block; color: var(--ink-soft); font-weight: 700; font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; }
.chnav a.next { text-align: right; }
.chnav a:hover { border-color: var(--amber); }
.backtop {
  position: fixed; right: 18px; bottom: 18px; width: 44px; height: 44px; border-radius: 50%; border: 0; cursor: pointer;
  background: var(--plum-2); color: #FFFFFF; font-size: 1.2rem; box-shadow: var(--shadow); opacity: 0; pointer-events: none; transition: opacity .2s;
}
.backtop.show { opacity: 1; pointer-events: auto; }

footer.site-foot { border-top: 3px solid var(--amber); background: var(--night); color: #EDCDD2; font-size: .86rem; }
footer.site-foot .in { max-width: 1080px; margin: 0 auto; padding: 22px 20px 34px; }
footer.site-foot b { color: #FFFFFF; }
footer.site-foot a { color: var(--amber-2); }

/* Landing page (dark) */
body.landing {
  color: #FAEDEF;
  background:
    radial-gradient(circle at 100% 0%, #6E1F2C 0, transparent 42%),
    radial-gradient(circle at 0% 100%, #612731 0, transparent 40%),
    linear-gradient(180deg, #3B141C 0%, #2A0E14 100%);
  background-attachment: fixed;
}
body.landing a { color: var(--amber-2); }
body.landing header.hero { padding: 56px 34px 62px; margin-bottom: 8px; border-bottom: 1px solid rgba(233, 159, 12, .4); }
body.landing .hero .logo { width: 96px; height: 96px; padding: 4px; }
.landing .eyebrow { display: inline-flex; background: rgba(233, 159, 12, .14); border: 1px solid rgba(233, 159, 12, .5); padding: 6px 15px; border-radius: 999px; color: var(--amber-2); }
.landing .hero h1 { margin-top: 16px; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 22px 70px; }
h2.section { font-size: 1.5rem; font-weight: 840; letter-spacing: -.4px; margin: 44px 0 4px; display: flex; align-items: center; gap: 12px; color: #FFFFFF; }
h2.section::before { content: ""; width: 26px; height: 26px; border-radius: 8px; background: var(--amber-grad); flex: none; }
.sub { color: #EBC5CC; margin: 0 0 16px; max-width: 80ch; }
.sub b { color: var(--amber-2); }
.grid { display: grid; gap: 18px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
.chapter {
  background: linear-gradient(180deg, #6A2B36, #57242C); border: 1px solid #7F2434; border-left: 6px solid var(--amber);
  border-radius: 18px; padding: 20px 21px; box-shadow: 0 1px 2px rgba(23, 7, 10, .35), 0 14px 34px rgba(23, 7, 10, .45);
  display: flex; flex-direction: column; gap: 9px; transition: border-color .15s, transform .15s;
}
.chapter:hover { transform: translateY(-2px); border-color: rgba(233, 159, 12, .55); border-left-color: var(--amber-2); }
.cnum { font-size: 1.3rem; display: flex; align-items: center; gap: 9px; }
.cnum > span { font-size: .72rem; font-weight: 850; letter-spacing: 1.2px; text-transform: uppercase; color: var(--amber-2); }
.chapter h3 { margin: 0; font-size: 1.16rem; font-weight: 820; color: #FFFFFF; }
.chapter p { margin: 0; color: #EBC5CC; font-size: .92rem; flex: 1; }
.topics { margin: 2px 0 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px; }
.topics li { font-size: .74rem; font-weight: 700; color: #FBE1AC; background: rgba(233, 159, 12, .10); border: 1px solid rgba(233, 159, 12, .32); border-radius: 7px; padding: 3px 8px; line-height: 1.35; }
.clinks { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.cl { text-decoration: none; font-weight: 800; font-size: .85rem; padding: 9px 15px; border-radius: 11px; }
body.landing .cl.amber, .cl.amber { background: var(--amber-grad); color: #372603; }
body.landing .cl.ghost, .cl.ghost { background: rgba(255, 255, 255, .12); color: #FFFFFF; border: 1px solid rgba(255, 255, 255, .22); }
.cl:hover { filter: brightness(1.06); }
.twocol { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; align-items: start; }
.panel { background: rgba(255, 255, 255, .06); border: 1px solid #7F2434; border-radius: 16px; padding: 18px 20px; }
.panel h3 { margin: 0 0 8px; color: #FFFFFF; font-size: 1.05rem; }
.panel ul { margin: 0; padding-left: 18px; color: #EBC5CC; font-size: .92rem; }
.panel li { margin: 4px 0; }
.panel b { color: #FFFFFF; }
body.landing footer.site-foot { background: transparent; border-top-color: rgba(233, 159, 12, .4); }

@media (max-width: 700px) {
  .hero .inner { flex-direction: column; }
  .hero .logo, body.landing .hero .logo { width: 64px; height: 64px; }
  header.hero, body.landing header.hero { padding: 36px 18px 40px; }
  main { padding: 0 12px; }
  .chnav { grid-template-columns: 1fr; }
  .chnav a.next { text-align: left; }
  .prob .body { padding: 12px 12px 6px; }
  details.ans { margin: 0 10px 12px; }
  .sym { min-width: 30px; padding: 2px 5px; }
}
@media (prefers-reduced-motion: reduce) { .chapter, .chapter:hover { transition: none; transform: none; } html { scroll-behavior: auto; } }
@media print {
  .progress, nav.top, .backtop, #activity-form, .chnav, .banner { display: none; }
  details.ans { display: block; }
  section.ch { box-shadow: none; break-inside: avoid-page; }
}

/* ---- Apps Script pages (student and admin) ---- */
.who { display: inline-flex; align-items: center; gap: 6px; background: rgba(255, 255, 255, .12); border: 1px solid rgba(255, 255, 255, .22); border-radius: 999px; padding: 6px 14px; font-size: .8rem; font-weight: 700; }
.loading { text-align: center; padding: 60px 20px; color: var(--ink-soft); }
body.landing .loading { color: #EBC5CC; }
.spinner { width: 34px; height: 34px; border-radius: 50%; border: 4px solid var(--plum-soft); border-top-color: var(--amber); animation: spin .9s linear infinite; margin: 0 auto 12px; }
@keyframes spin { to { transform: rotate(360deg); } }
.badge { display: inline-block; font-size: .66rem; font-weight: 850; letter-spacing: .06em; text-transform: uppercase; padding: 3px 9px; border-radius: 999px; }
.badge.open { background: rgba(79, 211, 138, .16); color: #7CE3A8; border: 1px solid rgba(79, 211, 138, .45); }
.badge.closed { background: rgba(255, 255, 255, .08); color: #EBC5CC; border: 1px solid rgba(255, 255, 255, .2); }
.badge.done { background: rgba(233, 159, 12, .16); color: var(--amber-2); border: 1px solid rgba(233, 159, 12, .45); }
.cnum .badge { margin-left: auto; }
.chapter.locked { opacity: .6; }
.chapter.locked:hover { transform: none; }
.notice { margin: 18px 0 0; padding: 14px 18px; border-radius: 14px; background: rgba(233, 159, 12, .12); border: 1px solid rgba(233, 159, 12, .4); color: #FBE1AC; }
.notice b { color: #FFFFFF; }
main .notice { background: var(--amber-soft); border-color: var(--amber-line); color: var(--amber-ink); }
main .notice b { color: var(--amber-ink); }

/* Video */
.video-wrap { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000000; border-radius: 14px; overflow: hidden; box-shadow: var(--shadow); }
.video-wrap iframe, .video-wrap #yt { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.cp-overlay { position: absolute; inset: 0; background: rgba(42, 14, 20, .94); color: #FFFFFF; display: flex; align-items: center; justify-content: center; padding: 18px; overflow-y: auto; }
.cp-overlay[hidden] { display: none; }
.cp-card { max-width: 620px; width: 100%; }
.cp-card .k { font-size: .72rem; font-weight: 850; letter-spacing: .1em; text-transform: uppercase; color: var(--amber-2); }
